name: API contract

# The node calls the public REST /v1. Fails when the live OpenAPI breaks the
# snapshot the node was built against; additive changes pass.
# After a reviewed, compatible change: refresh contract/openapi.snapshot.json.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'contract/**'

permissions:
  contents: read

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the live OpenAPI
        run: curl -fsS https://api.hypotize.ai/v1/openapi.json -o live-openapi.json
      - name: Check for breaking changes
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: contract/openapi.snapshot.json
          revision: live-openapi.json
          fail-on: ERR
